name: export-current-upstream
on:
  push:
    branches: [audit-export]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tinygrad/tinygrad
          ref: 87f88a072be9ab54e7534ab978b1e64c4f4d9b37
      - name: Pack source
        run: tar --exclude=.git -czf /tmp/tinygrad-upstream-current.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: tinygrad-upstream-current
          path: /tmp/tinygrad-upstream-current.tar.gz
          retention-days: 1
