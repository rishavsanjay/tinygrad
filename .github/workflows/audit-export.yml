name: export-latest-upstream
on:
  push:
    branches: [audit-export]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tinygrad/tinygrad
          ref: 289656f6e88e94ecce8dfb1dcf5378fccf577d0d
      - name: Pack source
        run: tar --exclude=.git -czf /tmp/tinygrad-latest.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: tinygrad-latest
          path: /tmp/tinygrad-latest.tar.gz
          retention-days: 1
