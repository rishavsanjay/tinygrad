name: rebase-pr17825
on:
  push:
    branches: [audit-pr17825]
permissions:
  contents: write
jobs:
  rebase:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase PR 17825 onto current upstream master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/tinygrad/tinygrad.git || true
          git fetch upstream master
          git fetch origin pr-17825
          git checkout -B pr-17825-rebased-auto origin/pr-17825
          git rebase -X ours upstream/master
      - name: Focused tests
        run: |
          python -m unittest -v test.backend.test_commutative_params
      - name: Push rebased branch
        if: always()
        run: |
          git status --short
          git log --oneline -12
          git push origin HEAD:refs/heads/pr-17825-rebased-auto --force
