name: export-pr17825-upstream
on:
  push:
    branches: [audit-pr17825]
    paths: [.github/workflows/export-pr17825-auto.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export pinned upstream master
        shell: bash
        run: |
          set -euxo pipefail
          git remote add upstream https://github.com/tinygrad/tinygrad.git || true
          git fetch upstream 9d0446a4ba8a532c8b674fb6ad795af015cd9dcf
          git archive --format=tar.gz --output=/tmp/pr17825-upstream.tar.gz 9d0446a4ba8a532c8b674fb6ad795af015cd9dcf
      - uses: actions/upload-artifact@v4
        with:
          name: pr17825-upstream-source
          path: /tmp/pr17825-upstream.tar.gz
