name: Unit Tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scheduler-probe:
    if: github.repository == 'rishavsanjay/tinygrad' && github.ref_name == 'scheduler-scaling-probe-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        layers: [2, 8, 24]
    env:
      DEV: NULL
      NULL_ALLOW_COPYOUT: '1'
      DEFAULT_FLOAT: HALF
      CAPTURE_PROCESS_REPLAY: '0'
      BENCHMARK: '3'
      BERT_LAYERS: ${{ matrix.layers }}
      MODEL: bert
      PYTHONPATH: .
      DEBUG: '0'
      BS: '24'
      SCACHE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e . numpy tqdm
      - name: Instrument stage timings
        run: |
          cat > scheduler_probe.py <<'PY'
          import collections, functools, importlib, json, os, runpy, time
          from tinygrad import Tensor
          codegen = importlib.import_module("tinygrad.codegen")
          tensor = importlib.import_module("tinygrad.tensor")
          jit = importlib.import_module("tinygrad.engine.jit")
          realize = importlib.import_module("tinygrad.engine.realize")
          times, counts = collections.Counter(), collections.Counter()
          def wrap(name, fn):
            @functools.wraps(fn)
            def timed(*args, **kwargs):
              start = time.perf_counter()
              try: return fn(*args, **kwargs)
              finally:
                times[name] += time.perf_counter() - start
                counts[name] += 1
            return timed
          def patch(name, modules):
            original = getattr(modules[0], name)
            wrapped = wrap(name, original)
            for module in modules:
              if getattr(module, name, None) is original: setattr(module, name, wrapped)
          Tensor.export = wrap("export", Tensor.export)
          patch("create_linear", [codegen, tensor, jit])
          for name in ("prepare_rangeify", "get_kernel_graph", "create_schedule"):
            patch(name, [codegen])
          for name in ("compile_linear", "link_linear", "run_linear"):
            patch(name, [realize, tensor, jit])
          original_call = jit._TinyJit.__call__
          @functools.wraps(original_call)
          def measured(self, *args, **kwargs):
            if getattr(self.fxn, "__name__", "") != "train_step_bert":
              return original_call(self, *args, **kwargs)
            times.clear()
            counts.clear()
            step = self.cnt
            start = time.perf_counter()
            try: return original_call(self, *args, **kwargs)
            finally:
              print("PROBE " + json.dumps(dict(layers=int(os.environ["BERT_LAYERS"]),
                devices=int(os.environ["GPUS"]), step=step, total_s=time.perf_counter()-start,
                inclusive_stage_s=dict(times), calls=dict(counts)), sort_keys=True), flush=True)
          jit._TinyJit.__call__ = measured
          runpy.run_module("examples.mlperf.model_train", run_name="__main__")
          PY
      - name: Fixed-batch scaling
        shell: bash
        run: |
          set -o pipefail
          failed=0
          for g in 1 2 4 8; do
            echo "::group::layers=$BERT_LAYERS devices=$g"
            GPUS=$g /usr/bin/time -v python -u scheduler_probe.py 2>&1 | tee "bert-${BERT_LAYERS}L-${g}G.log" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Print stage summary
        if: always()
        run: grep -h '^PROBE ' bert-*.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduler-probe-${{ matrix.layers }}
          path: bert-*.log
