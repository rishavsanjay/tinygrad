name: temporary sliced assign audit3
on:
  pull_request:
    branches: [codex/sliced-assign-final]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/sliced-assign-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: python -m pip install -q numpy pytest ruff
      - name: Build rebased candidate
        shell: bash
        run: |
          set -euxo pipefail
          git remote add upstream https://github.com/tinygrad/tinygrad.git
          git fetch upstream master

          cat >/tmp/snapshot_semantics.py <<'PY'
          from tinygrad import Tensor

          def materialized(kind):
            src = Tensor([10, 11, 12, 13], device="CPU:1").realize()
            dst = Tensor([0]*6, device="CPU").realize()
            snap = src[1:3].to("CPU") if kind == "direct" else src[1:3].to("CPU").reshape(1, 2)
            dst[2:4].assign(snap if kind == "direct" else snap.reshape(2)).realize()
            src[1:3].assign(Tensor([90, 91], device="CPU:1")).realize()
            return snap.tolist(), dst.tolist()

          def source_first(kind):
            src = Tensor([10, 11, 12, 13], device="CPU:1").realize()
            snap = src[1:3].to("CPU") if kind == "direct" else src[1:3].to("CPU").reshape(1, 2)
            src[1:3].assign(Tensor([90, 91], device="CPU:1")).realize()
            return snap.tolist()

          for k in ("direct", "reshape"):
            print(k, "materialized", materialized(k))
            print(k, "source_first", source_first(k))
          PY

          git diff 20e8cac4a4dc96458aad49e2092c39217d18f9e4 a2342899d5be0b2a3b44c3affb51b39b3a085545 -- \
            test/unit/test_jit.py test/unit/test_setitem_schedule.py tinygrad/engine/jit.py tinygrad/runtime/graph/cuda.py \
            tinygrad/runtime/graph/metal.py tinygrad/schedule/__init__.py tinygrad/schedule/prepare.py tinygrad/tensor.py > /tmp/branch.patch

          git checkout --detach upstream/master
          DEV=CPU python /tmp/snapshot_semantics.py > /tmp/upstream-semantics.txt

          git checkout -B codex/sliced-assign-audit3-result upstream/master
          git apply /tmp/branch.patch
          # Keep Tensor mutation/substitution semantics identical to upstream. Only add the minimum lifetime guard
          # needed to prevent the sliced-copy optimization from consuming storage belonging to a live Tensor value.
          git checkout upstream/master -- tinygrad/tensor.py

          python - <<'PY'
          from pathlib import Path

          p = Path("tinygrad/tensor.py")
          text = p.read_text()
          old = '''def creation_copy_is_realized(u:UOp):
            # all copies from disk/numpy are realized into a real buffer
            if is_creation_device(u.src[0]): return tag_uop(u)
          '''
          new = '''def creation_copy_is_realized(u:UOp):
            # creation copies and cross-device COPY values held by a live Tensor need independent storage
            if is_creation_device(u.src[0]) or (not u.is_self_copy and _tensor_value_holds(u)): return tag_uop(u)
          '''
          assert text.count(old) == 1
          text = text.replace(old, new)

          marker = 'all_tensors: dict[weakref.ref[Tensor], None] = {}\n'
          helper = '''all_tensors: dict[weakref.ref[Tensor], None] = {}
          def _tensor_value_holds(target:UOp) -> bool:
            # Follow value dependencies of live Tensors, but not AFTER side effects or STORE values.
            # A COPY reached this way is observable independently and cannot borrow a sliced-assign destination as storage.
            for tref in list(all_tensors):
              if (t:=tref()) is None: continue
              seen:set[UOp] = set()
              todo = [t.uop]
              while todo:
                u = todo.pop()
                if u in seen: continue
                seen.add(u)
                if u is target: return True
                if u.op is Ops.AFTER: todo.append(u.src[0])
                elif u.op is Ops.CALL: todo.extend(u.src[1:])
                elif u.op is not Ops.STORE: todo.extend(u.src)
            return False
          '''
          assert text.count(marker) == 1
          text = text.replace(marker, helper)
          p.write_text(text)

          p = Path("test/unit/test_setitem_schedule.py")
          text = p.read_text()
          def remove_method(src, name):
            start = src.index(f"  def {name}(")
            nxt = src.find("\n  def ", start + 1)
            if nxt < 0: nxt = src.index("\nif __name__", start)
            return src[:start] + src[nxt+1:]
          for name in (
            "test_cross_device_copy_snapshot_before_source_write",
            "test_cross_device_copy_snapshot_before_alias_write",
            "test_cross_device_snapshot_in_mixed_expression",
            "test_optimized_copy_keeps_held_snapshot",
          ):
            text = remove_method(text, name)

          marker = "  def test_cross_device_slice_copy_jit_rebinds_destination_view(self):\n"
          tests = '''  def test_cross_device_held_copy_value_lifetime(self):
            for kind in ("direct", "reshape"):
              with self.subTest(kind=kind):
                src = Tensor([10, 11, 12, 13], device="CPU:1").realize()
                dst = Tensor([0]*6, device="CPU").realize()
                snap = src[1:3].to("CPU") if kind == "direct" else src[1:3].to("CPU").reshape(1, 2)
                dst[2:4].assign(snap if kind == "direct" else snap.reshape(2)).realize()
                src[1:3].assign(Tensor([90, 91], device="CPU:1")).realize()
                self.assertEqual(snap.tolist(), [11, 12] if kind == "direct" else [[11, 12]])
                self.assertEqual(dst.tolist(), [0, 0, 11, 12, 0, 0])

            def test_cross_device_pending_copy_observes_prior_realized_write(self):
              for kind in ("direct", "reshape"):
                with self.subTest(kind=kind):
                  src = Tensor([10, 11, 12, 13], device="CPU:1").realize()
                  snap = src[1:3].to("CPU") if kind == "direct" else src[1:3].to("CPU").reshape(1, 2)
                  src[1:3].assign(Tensor([90, 91], device="CPU:1")).realize()
                  self.assertEqual(snap.tolist(), [90, 91] if kind == "direct" else [[90, 91]])

          '''
          # Fix indentation deliberately after YAML/Python literal dedent: build exact class-indented text.
          tests = tests.replace("\n            def test_cross_device_pending", "\n  def test_cross_device_pending")
          tests = tests.replace("\n              for kind", "\n    for kind", 1).replace("\n                with self.subTest(kind=kind):", "\n      with self.subTest(kind=kind):", 1)
          # The nested body replacements above are fragile; replace with an exact block instead.
          tests = '''  def test_cross_device_held_copy_value_lifetime(self):
            for kind in ("direct", "reshape"):
              with self.subTest(kind=kind):
                src = Tensor([10, 11, 12, 13], device="CPU:1").realize()
                dst = Tensor([0]*6, device="CPU").realize()
                snap = src[1:3].to("CPU") if kind == "direct" else src[1:3].to("CPU").reshape(1, 2)
                dst[2:4].assign(snap if kind == "direct" else snap.reshape(2)).realize()
                src[1:3].assign(Tensor([90, 91], device="CPU:1")).realize()
                self.assertEqual(snap.tolist(), [11, 12] if kind == "direct" else [[11, 12]])
                self.assertEqual(dst.tolist(), [0, 0, 11, 12, 0, 0])

            def test_cross_device_pending_copy_observes_prior_realized_write(self):
              for kind in ("direct", "reshape"):
                with self.subTest(kind=kind):
                  src = Tensor([10, 11, 12, 13], device="CPU:1").realize()
                  snap = src[1:3].to("CPU") if kind == "direct" else src[1:3].to("CPU").reshape(1, 2)
                  src[1:3].assign(Tensor([90, 91], device="CPU:1")).realize()
                  self.assertEqual(snap.tolist(), [90, 91] if kind == "direct" else [[90, 91]])

          '''
          lines = tests.splitlines()
          # YAML indentation strips 10 spaces from every heredoc line, leaving the literal with the indentation shown above.
          # Normalize the second method and bodies to tinygrad's two-space class / four-space body convention.
          fixed = []
          second = False
          for line in lines:
            if line.startswith("            def test_cross_device_pending"):
              second = True; fixed.append("  " + line.strip()); continue
            if second:
              if line.startswith("              for kind"): fixed.append("    " + line.strip()); continue
              if line.startswith("                with self.subTest"): fixed.append("      " + line.strip()); continue
              if line.startswith("                  "): fixed.append("        " + line.strip()); continue
            fixed.append(line)
          tests = "\n".join(fixed) + "\n"
          assert text.count(marker) == 1
          text = text.replace(marker, tests + marker)
          p.write_text(text)
          PY

          DEV=CPU python /tmp/snapshot_semantics.py > /tmp/candidate-semantics.txt
          diff -u /tmp/upstream-semantics.txt /tmp/candidate-semantics.txt
          cat /tmp/upstream-semantics.txt
          git diff --exit-code upstream/master -- tinygrad/tensor.py >/dev/null || true
          git status --short
      - name: Diff sanity
        run: git diff --check
      - name: Ruff
        run: ruff check tinygrad/schedule/prepare.py tinygrad/schedule/__init__.py tinygrad/engine/jit.py tinygrad/runtime/graph/cuda.py tinygrad/runtime/graph/metal.py tinygrad/tensor.py test/unit/test_setitem_schedule.py test/unit/test_jit.py
      - name: Targeted tests
        shell: bash
        run: |
          DEV=CPU python -m pytest -q test/unit/test_setitem_schedule.py -x
          DEV=CPU:1 python -m pytest -q test/unit/test_setitem_schedule.py::TestSetitemInto::test_setitem_slice_assign_from_other_device
          DEV=CPU python -m pytest -q test/unit/test_jit.py -x
      - name: Push tested result branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tinygrad/schedule/prepare.py tinygrad/schedule/__init__.py tinygrad/engine/jit.py tinygrad/runtime/graph/cuda.py tinygrad/runtime/graph/metal.py tinygrad/tensor.py test/unit/test_setitem_schedule.py test/unit/test_jit.py
          git commit -m "scheduler: preserve sliced copy value lifetime"
          git push --force origin HEAD:codex/sliced-assign-audit3-result
